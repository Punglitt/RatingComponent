<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Rating component</title>
</head>

<body>
  <script src="js/bootstrap.bundle.min.js"></script>
  <html lang="en">
</body>
<div class="container">
  <div class="card mt-5 bg-light shadow-lg border-0 rounded-4">
    <div class="card-body">
      <!-- Rating Summary -->
      <div class="row p-5">
        <div class="col-7">
          <h2>What others think about this product</h2>
        </div>
        <div class="col-5">
          <div class="card">
            <div class="card-body text-center">
              <h3 Class="display-5 fw-semibold"><i class="fa-solid fa-star text-warning"></i>4.8</h3>
              <p>Average Rating</p>
            </div>
          </div>
        </div>
      </div>
      <!-- Search Reviews -->
      <div class="row">
        <div class="col-12">
          <div class="input-group input-group-1g">
            <span class="input-group-text rounded-start-5">
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" class="form-control rounded-end-5" placeholder="Search Reviews">
          </div>
        </div>
      </div>
      <!--Rating Distribution -->
      <div class="row p-5">
        <div class="col-12">
          <h2>Rating</h2>
          <!--For Level 5 -->
          <div Class="d-flex align-items-center gap-1">
            <span>5</span><i class="fa-solid fa-star text-warning"></i>
            <div class="progress ms-4" role="progressbar" aria-label="Basic  example" style="width: 100%" height="10px">
              <div class="progress-bar bg-warning" style="width: 80%" height="10px"></div>
            </div>
          </div>
          <!--For Level 4 -->
          <div Class="d-flex align-items-center gap-1">
            <span>4</span><i class="fa-solid fa-star text-warning"></i>
            <div class="progress ms-4" role="progressbar" aria-label="Basic  example" style="width: 100%" height="10px">
              <div class="progress-bar bg-warning" style="width: 60%" height="10px"></div>
            </div>
          </div>
          <!--For Level 3 -->
          <div Class="d-flex align-items-center gap-1">
            <span>3</span><i class="fa-solid fa-star text-warning"></i>
            <div class="progress ms-4" role="progressbar" aria-label="Basic  example" style="width: 100%" height="10px">
              <div class="progress-bar bg-warning" style="width: 20%" height="10px"></div>
            </div>
          </div>
          <!--For Level 2 -->
          <div Class="d-flex align-items-center gap-1">
            <span>2</span><i class="fa-solid fa-star text-warning"></i>
            <div class="progress ms-4" role="progressbar" aria-label="Basic  example" style="width: 100%" height="10px">
              <div class="progress-bar bg-warning" style="width: 10%" height="10px"></div>
            </div>
          </div>
          <!--For Level 1 -->
          <div Class="d-flex align-items-center gap-1">
            <span>1</span><i class="fa-solid fa-star text-warning"></i>
            <div class="progress ms-4" role="progressbar" aria-label="Basic  example" style="width: 100%" height="10px">
              <div class="progress-bar bg-warning" style="width: 27%" height="10px"></div>
            </div>
          </div>
          <!-- Write Review Button Section -->
          <div class="row px-0 py-5">
            <div class="col-12">
              <a href="#" class="btn btn-success btn-lg rounded-5">Write Review</a>
            </div>
          </div>
        </div>

</html>
